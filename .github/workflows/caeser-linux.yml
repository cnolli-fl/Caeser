name: Publish verified Caeser Linux 0.4.0

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: caeser-linux-v0.4.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cnolli-fl/Caeser' && github.ref == 'refs/heads/codex/release-linux-0.4.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: cnolli-fl/Caeser
      BUILD_RUN: '45615939426'
      TESTED_SHA: 13743560008cdda10561794bb64eb4ccd31a8c4d
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the exact build passed
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha, .conclusion] | @tsv' |
            awk -v sha="$TESTED_SHA" '$1 == sha && $2 == "success" {found=1} END {exit !found}'
      - uses: actions/download-artifact@v4
        with:
          name: Caeser-Linux-x86_64
          github-token: ${{ github.token }}
          run-id: 45615939426
          path: release/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: Caeser-Linux-aarch64
          github-token: ${{ github.token }}
          run-id: 45615939426
          path: release/aarch64
      - name: Verify and publish
        run: |
          set -euo pipefail
          assets=()
          for arch in x86_64 aarch64; do
            asset="release/$arch/Caeser-0.4.0-Linux-$arch.AppImage"
            expected="$(awk 'NR==1 {print $1}' "$asset.sha256")"
            actual="$(sha256sum "$asset" | awk '{print $1}')"
            test "$actual" = "$expected"
            assets+=("$asset")
            printf '\n- %s SHA-256: `%s`' "$arch" "$actual" >> release-notes.md
          done
          printf '\n' >> release-notes.md
          gh release create linux-v0.4.0 "${assets[@]}" --target "$TESTED_SHA" \
            --title "Caeser 0.4.0 · Linux (Fedora KDE)" --notes-file release-notes.md \
            --prerelease --latest=false
          gh api repos/cnolli-fl/Caeser/releases/tags/linux-v0.4.0 > published.json
          jq -e '.draft == false and .prerelease == true and (.assets | length == 2)' published.json
          for asset in "${assets[@]}"; do
            actual="$(sha256sum "$asset" | awk '{print $1}')"
            jq -e --arg name "${asset##*/}" --arg digest "sha256:$actual" \
              '.assets | any(.name == $name and .digest == $digest and .state == "uploaded")' published.json
          done
