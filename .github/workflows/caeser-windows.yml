name: Caeser Windows
on:
  push:
    branches: [main, 'codex/windows-*']
    paths:
      - 'Windows/**'
      - '.github/workflows/caeser-windows.yml'
      - 'Sources/VideoDownloader/Resources/**'
  pull_request:
    paths:
      - 'Windows/**'
      - '.github/workflows/caeser-windows.yml'
      - 'Sources/VideoDownloader/Resources/**'
  workflow_dispatch:
    inputs:
      bootstrap_only:
        description: Compilar apenas o instalador online com um fixture local
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: caeser-windows-${{ github.ref }}${{ inputs.bootstrap_only && '-bootstrap' || '' }}
  cancel-in-progress: true
jobs:
  bootstrap-compile:
    if: inputs.bootstrap_only == true
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compilar instalador online sem publicar payload de teste
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw Windows/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $work = Join-Path $env:RUNNER_TEMP ('Caeser-bootstrap-compile-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          $payload = Join-Path $work "Caeser-$version-Windows-x64-Setup.exe"
          [IO.File]::WriteAllBytes($payload, [Text.Encoding]::ASCII.GetBytes('MZ-not-an-installer-local-compile-fixture'))
          ./Windows/Scripts/BuildBootstrap.ps1 -Installer $payload -OutputDirectory $work
  build-and-test:
    if: inputs.bootstrap_only != true
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: Windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Windows/global.json
      - name: Testar lógica e processos reais
        run: dotnet test Caeser.Core.Tests/Caeser.Core.Tests.csproj -c Release --logger "trx;LogFileName=windows.trx" --results-directory TestResults
      - name: Validar scripts PowerShell
        run: |
          Get-ChildItem Scripts -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Compilar aplicativo autocontido
        run: ./Scripts/Build.ps1
      - name: Abrir a interface e capturar os dois temas
        run: ./Scripts/TestUi.ps1
      - name: Guardar aplicativo compilado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Caeser-Windows-build-${{ github.run_number }}
          path: Windows/artifacts/app/
          retention-days: 1
      - name: Guardar diagnóstico e capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Caeser-Windows-QA-${{ github.run_number }}
          path: |
            Windows/artifacts/ui-smoke/
            Windows/TestResults/
          retention-days: 7
  package:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Windows/global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Caeser-Windows-build-${{ github.run_number }}
          path: Windows/artifacts/app
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Recuperar ferramentas verificadas da mesma construção
        id: media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Windows/.tools/win-x64
          key: windows-media-x64-py3.14.7-v2-${{ hashFiles('Windows/Packaging/tools.lock.json', 'Windows/Packaging/spotdl-windows-requirements.txt', 'Packaging/spotdl-requirements.txt', 'Windows/Packaging/MediaTools.spec', 'Windows/Scripts/MediaEntry.py', 'Windows/Caeser.Launcher/ytdlp.c', 'Windows/Scripts/BuildLauncher.ps1', 'Windows/Scripts/BuildMediaTools.sh', 'Windows/Scripts/BuildSpotDL.ps1', 'Windows/Scripts/DownloadTools.ps1', 'Windows/Scripts/CollectPythonLicenses.py', 'Windows/Scripts/CollectSourceNotices.py') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
      - name: Baixar e verificar ferramentas e fontes fixados
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: ./Scripts/DownloadTools.ps1
      - name: Construir FFmpeg e LAME sem dependências externas
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash Scripts/BuildMediaTools.sh .cache/media .tools/win-x64
      - name: Construir spotDL com extrator atualizado
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: ./Scripts/BuildSpotDL.ps1
      - name: Guardar ferramentas para testar novas correções sem reconstruí-las
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Windows/.tools/win-x64
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Verificar ferramentas e gerar instalador e ZIP
        run: ./Scripts/Package.ps1
      - name: Testar instalação, abertura e desinstalação
        run: ./Scripts/TestInstaller.ps1
      - name: Testar instalador online e medir redução real
        run: ./Scripts/TestBootstrap.ps1
      - name: Guardar pacotes Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Caeser-Windows-package-${{ github.run_number }}
          path: Windows/artifacts/dist/
          retention-days: 7
      - name: Guardar diagnóstico do pacote
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Caeser-Windows-package-QA-${{ github.run_number }}
          path: |
            Windows/artifacts/installed-ui/
            Windows/artifacts/portable-ui/
            Windows/artifacts/installer-test.log
            Windows/artifacts/tools-versions.json
            Windows/artifacts/bootstrap-qa/
            Windows/TestResults/
          retention-days: 7
